name: Build ESPectrum Turbo Spectrum
# CI trigger check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build PSRAM firmware
        run: pio run -e psram

      - name: Upload linker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psram-linker-diagnostics
          path: |
            .pio/build/psram/firmware.map
            .pio/build/psram/firmware.elf
          if-no-files-found: warn
          retention-days: 7
