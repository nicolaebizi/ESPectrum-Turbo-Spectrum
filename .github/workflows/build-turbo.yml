name: Build ESPectrum Turbo Spectrum
# CI trigger check

on:
  push:
    branches: [ main, build-bluepad32-corrected ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build PSRAM firmware
        run: pio run -e psram

      - name: Install esptool
        run: python -m pip install "esptool==4.4"

      - name: Create complete flash image
        run: |
          python -m esptool --chip esp32 merge_bin \
            --flash_mode keep \
            --flash_freq keep \
            --flash_size keep \
            -o .pio/build/psram/merged.bin \
            0x1000 .pio/build/psram/bootloader.bin \
            0x8000 .pio/build/psram/partitions.bin \
            0x40000 .pio/build/psram/firmware.bin

      - name: Upload complete firmware
        uses: actions/upload-artifact@v4
        with:
          name: psram-complete-firmware
          path: .pio/build/psram/merged.bin
          if-no-files-found: error
          retention-days: 7

      - name: Upload linker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psram-linker-diagnostics
          path: |
            .pio/build/psram/firmware.map
            .pio/build/psram/firmware.elf
          if-no-files-found: warn
          retention-days: 7
